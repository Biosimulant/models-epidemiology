schema_version: '2.0'
title: Roda2020 - SIR model of COVID-19 spread in Wuhan
description: =Since the COVID-19 outbreak in Wuhan City in December of 2019, numerous
  model predictions on the COVID-19 epidemics in Wuhan and other parts of China have
  been reported. It can be used to explore transmission dynamics and compare scenario
  outcomes across conditions.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Weston C Roda
- Marie B Varughese
- Donglin Han
- Michael Y Li
upstream:
  id: biomodels_ebi:BIOMD0000000957
  source_db: biomodels_ebi
  source_id: BIOMD0000000957
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000957
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000957?filename=Roda2020.xml
  license: CC0
biosim:
  entrypoint: src.roda2020_sir_model_of_covid_19_spread_in_wuhan_biomd0000000957_model:Roda2020SirModelOfCovid19SpreadInWuhanBiomd0000000957Model
  init_kwargs:
    model_path: data/BIOMD0000000957.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: Transmission-rate parameter. Maps to SBML symbol `beta`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
  - name: confirmed
    maps_to: Confirmed
    label: Confirmed
