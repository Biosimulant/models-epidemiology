schema_version: '2.0'
title: Ndairou2020 - early-stage transmission dynamics of COVID-19 in Wuhan
description: We propose a compartmental mathematical model for the spread of the COVID-19
  disease with special focus on the transmissibility of super-spreaders individuals.
  It can be used to explore transmission dynamics and compare scenario outcomes across
  conditions.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- "Fa\xEF\xE7al Nda\xEFrou"
- "Iv\xE1n Area"
- Nieto JJ
- Delfim F M Torres
upstream:
  id: biomodels_ebi:BIOMD0000000958
  source_db: biomodels_ebi
  source_id: BIOMD0000000958
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000958
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000958?filename=Ndairou2020.xml
  license: CC0
biosim:
  entrypoint: src.ndairou2020_early_stage_transmission_dynamics_of_biomd0000000958_model:Ndairou2020EarlyStageTransmissionDynamicsOfBiomd0000000958Model
  init_kwargs:
    model_path: data/BIOMD0000000958.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: Transmission-rate parameter. Maps to SBML symbol `beta`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: exposed
    maps_to: Exposed
    label: Exposed
  - name: infectious
    maps_to: Infectious
    label: Infectious
  - name: hospitalised
    maps_to: Hospitalised
    label: Hospitalised
  - name: fatalities
    maps_to: Fatalities
    label: Fatalities
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
  - name: super_spreaders
    maps_to: Super_spreaders
    label: Super spreaders
  - name: asymptomatic
    maps_to: Asymptomatic
    label: Asymptomatic
