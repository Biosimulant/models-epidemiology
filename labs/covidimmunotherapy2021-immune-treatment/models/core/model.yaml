schema_version: '2.0'
title: COVID-19 immunotherapy A mathematical model
description: We propose a within-host population (ODE) innate immunity model, whose
  focus is on NK cells and their relevant role in preventing COVID19 from progressing
  to the acute phase that may eventually lead t. It can be used to explore transmission
  dynamics and compare scenario outcomes across conditions.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- biomodels_ebi
upstream:
  id: biomodels_ebi:MODEL2109130003
  source_db: biomodels_ebi
  source_id: MODEL2109130003
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2109130003
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2109130003?filename=COVID19
    immunotherapy a Mathematical Model.xml
  license: CC0
biosim:
  entrypoint: src.covid_19_immunotherapy_a_mathematical_model_model2109130003_model:Covid19ImmunotherapyAMathematicalModelModel2109130003Model
  init_kwargs:
    model_path: data/MODEL2109130003.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: virus_clearance_rate
    maps_to: c
    label: Virus Clearance Rate
    description: Virus clearance-rate parameter. Maps to SBML symbol `c`.
  - name: virus_production_rate
    maps_to: p
    label: Virus Production Rate
    description: Virus production-rate parameter. Maps to SBML symbol `p`.
  - name: infected_cell_death_rate
    maps_to: delta
    label: Infected Cell Death Rate
    description: Infected-cell loss parameter. Maps to SBML symbol `delta`.
  - name: immune_activation_rate
    maps_to: epsilon
    label: Immune Activation Rate
    description: Immune activation/progression parameter. Maps to SBML symbol `epsilon`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: treated_viral_load
    maps_to: VL_tratamento
    label: Treated viral load
  - name: treated_free_virus
    maps_to: V_tratamento
    label: Treated free virus
  - name: treated_infected_epithelial_cells
    maps_to: A_I_tratamento
    label: Treated infected epithelial cells
  - name: treated_activated_neutrophils
    maps_to: N_at_tratamento
    label: Treated activated neutrophils
  - name: treated_interleukin_12
    maps_to: I_12_tratamento
    label: Treated interleukin 12
  - name: treated_antibody_response
    maps_to: I_ab_tratamento
    label: Treated antibody response
  - name: treated_b_cells
    maps_to: B_tratamento
    label: Treated B cells
  - name: treatment_inhibition_signal
    maps_to: Inib_tratamento
    label: Treatment inhibition signal
