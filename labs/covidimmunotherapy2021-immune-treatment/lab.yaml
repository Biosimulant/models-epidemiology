schema_version: '2.0'
title: COVID-19 immunotherapy A mathematical model Lab
description: Single-model lab wrapper for COVID-19 immunotherapy A mathematical model.
  We propose a within-host population (ODE) innate immunity model, whose focus is
  on NK cells and their relevant role in preventing COVID19 from progressing to the
  acute phase that may eventually lead t. It can be used to explore transmission dynamics
  and compare scenario outcomes across conditions.
models:
- alias: epidemiology_sbml_covid_19_immunotherapy_a_mathematical_model_model2109130003_model
  path: models/core
  parameters:
    model_path: data/MODEL2109130003.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: epidemiology_sbml_covid_19_immunotherapy_a_mathematical_model_model2109130003_model.state
  to:
