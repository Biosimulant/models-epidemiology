  to:
  - visualisation.epidemiology_sbml_covid_19_immunotherapy_a_mathematical_model_model2109130003_model_summary
- from: epidemiology_sbml_covid_19_immunotherapy_a_mathematical_model_model2109130003_model.species_labels
  to:
  - visualisation.epidemiology_sbml_covid_19_immunotherapy_a_mathematical_model_model2109130003_model_species_labels
