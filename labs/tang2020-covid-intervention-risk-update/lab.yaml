schema_version: '2.0'
title: Tang2020 - Estimation of transmission risk of COVID-19 and impact of public
  health interventions - update Lab
description: Single-model lab wrapper for Tang2020 - Estimation of transmission risk
  of COVID-19 and impact of public health interventions - update. The basic reproduction
  number of an infectious agent is the average number of infections one case can generate
  over the course of the infectious period, in a na\u00efve, uninfected population.
  It can be used to explore transmission dynamics and compare scenario outcomes across
  conditions.
