schema_version: '2.0'
title: Garira2019 - A coupled multiscale model to guide malaria control and elimination
  Lab
description: 'Single-model lab wrapper for Garira2019 - A coupled multiscale model
  to guide malaria control and elimination. This is a coupled multiscale mathematical
  model of malaria control and elimination containing four submodels: mosquito-to-human
  transmission of the malaria parasite, human-to-mosquito transmission of. It can
  be used to explore transmission dynamics and compare scenario outcomes across conditions.'
models:
- alias: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model
  path: models/core
  parameters:
    model_path: data/MODEL2003190008.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.state
  to:
  - visualisation.epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model_state
- from: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.summary
  to:
  - visualisation.epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model_summary
- from: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.species_labels
  to:
  - visualisation.epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model_species_labels
io:
  inputs:
  - name: mosquito_to_human_transmission
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.mosquito_to_human_transmission
    label: Mosquito To Human Transmission
  - name: human_to_mosquito_transmission
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.human_to_mosquito_transmission
    label: Human To Mosquito Transmission
  - name: human_recovery_rate
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.human_recovery_rate
    label: Human Recovery Rate
  - name: mosquito_mortality_rate
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.mosquito_mortality_rate
    label: Mosquito Mortality Rate
  - name: gametocyte_production_rate
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.gametocyte_production_rate
    label: Gametocyte Production Rate
  outputs:
  - name: state
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.state
    label: Model state
  - name: summary
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.species_labels
    label: Species labels
  - name: susceptible_humans
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.susceptible_humans
    label: Susceptible humans
  - name: infected_humans
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.infected_humans
    label: Infected humans
  - name: vector_parasite_load
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.vector_parasite_load
    label: Vector parasite load
  - name: susceptible_vectors
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.susceptible_vectors
    label: Susceptible vectors
  - name: infected_vectors
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.infected_vectors
    label: Infected vectors
  - name: human_gametocyte_load
    maps_to: epidemiology_sbml_garira2019_a_coupled_multiscale_model_to_guide_m_model2003190008_model.human_gametocyte_load
    label: Human gametocyte load
runtime:
  duration: 10.0
  communication_step: 0.1
  initial_inputs: {}
