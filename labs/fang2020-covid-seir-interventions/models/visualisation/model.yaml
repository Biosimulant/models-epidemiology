schema_version: '2.0'
title: Fang2020 - SEIR model of COVID-19 transmission considering government interventions
  in Wuhan Visualisation
description: Desktop-compatible visualisation for the curated epidemiology lab.
standard: other
tags:
- epidemiology
- visualisation
- curated
biosim:
  entrypoint: src.epidemiology_visualisation:EpidemiologyVisualisationModel
  init_kwargs:
    lab_title: Fang2020 - SEIR model of COVID-19 transmission considering government
      interventions in Wuhan
    question: Do intervention-modulated SEIR dynamics reduce the COVID-19 infection
      peak?
    sources:
    - alias: epidemiology_sbml_fang2020_seir_model_of_covid_19_transmission_con_biomd0000000984_model
      schemas:
        state:
          Exposed: float
          Infected: float
          Susceptible: float
          Recovered: float
          Total_population: float
        summary:
          duration_simulated: float
          observable_count: int
          largest_change_observable: str
          largest_change_magnitude: float
          peak_observable: str
          peak_value: float
        species_labels:
          Exposed: str
          Infected: str
          Susceptible: str
          Recovered: str
          Total_population: str
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
io:
  inputs:
  - name: epidemiology_sbml_fang2020_seir_model_of_covid_19_transmission_con_biomd0000000984_model_state
    maps_to: epidemiology_sbml_fang2020_seir_model_of_covid_19_transmission_con_biomd0000000984_model.state
    label: Model state
  - name: epidemiology_sbml_fang2020_seir_model_of_covid_19_transmission_con_biomd0000000984_model_summary
    maps_to: epidemiology_sbml_fang2020_seir_model_of_covid_19_transmission_con_biomd0000000984_model.summary
    label: Simulation summary
  - name: epidemiology_sbml_fang2020_seir_model_of_covid_19_transmission_con_biomd0000000984_model_species_labels
    maps_to: epidemiology_sbml_fang2020_seir_model_of_covid_19_transmission_con_biomd0000000984_model.species_labels
    label: Species labels
  outputs: []
