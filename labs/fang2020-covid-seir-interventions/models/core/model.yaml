schema_version: '2.0'
title: Fang2020 - SEIR model of COVID-19 transmission considering government interventions
  in Wuhan
description: "Using the parameterized susceptible\u2010exposed\u2010infectious\u2010\
  recovered model, we simulated the spread dynamics of coronavirus disease 2019 (COVID\u2010\
  19) outbreak and impact of different control measures, condu. It can be used to\
  \ explore transmission dynamics and compare scenario outcomes across conditions."
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Yaqing Fang
- Yiting Nie
- Marshare Penny
upstream:
  id: biomodels_ebi:BIOMD0000000984
  source_db: biomodels_ebi
  source_id: BIOMD0000000984
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000984
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000984?filename=Fang2020.xml
  license: CC0
biosim:
  entrypoint: src.fang2020_seir_model_of_covid_19_transmission_con_biomd0000000984_model:Fang2020SeirModelOfCovid19TransmissionConBiomd0000000984Model
  init_kwargs:
    model_path: data/BIOMD0000000984.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: Transmission-rate parameter. Maps to SBML symbol `beta`.
  - name: baseline_transmission_rate
    maps_to: beta_o
    label: Baseline Transmission Rate
    description: Baseline transmission-rate parameter. Maps to SBML symbol `beta_o`.
  - name: recovery_rate
    maps_to: gamma
    label: Recovery Rate
    description: Recovery-rate parameter. Maps to SBML symbol `gamma`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: exposed
    maps_to: Exposed
    label: Exposed
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
  - name: total_population
    maps_to: Total_population
    label: Total population
