schema_version: '2.0'
title: Weitz2020 - SIR model of COVID-19 transmission with shielding
description: The COVID-19 pandemic has precipitated a global crisis, with more than
  1,430,000 confirmed cases and more than 85,000 confirmed deaths globally as of 9
  April 2020. It can be used to explore transmission dynamics and compare scenario
  outcomes across conditions.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Joshua S Weitz
- Stephen J Beckett
- Ashley R Coenen
- David Demory
- Marian Dominguez-Mirazo
upstream:
  id: biomodels_ebi:BIOMD0000000963
  source_db: biomodels_ebi
  source_id: BIOMD0000000963
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000963
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000963?filename=Weitz2020.xml
  license: CC0
biosim:
  entrypoint: src.weitz2020_sir_model_of_covid_19_transmission_wit_biomd0000000963_model:Weitz2020SirModelOfCovid19TransmissionWitBiomd0000000963Model
  init_kwargs:
    model_path: data/BIOMD0000000963.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: Transmission-rate parameter. Maps to SBML symbol `beta`.
  - name: recovery_rate
    maps_to: gamma
    label: Recovery Rate
    description: Recovery-rate parameter. Maps to SBML symbol `gamma`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
