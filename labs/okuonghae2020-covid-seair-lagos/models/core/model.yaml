schema_version: '2.0'
title: Okuonghae2020 - SEAIR model of COVID-19 transmission in Lagos, Nigeria
description: This work examines the impact of various non-pharmaceutical control measures
  (government and personal) on the population dynamics of the novel coronavirus disease
  2019 (COVID-19) in Lagos, Nigeria, us. It can be used to explore transmission dynamics
  and compare scenario outcomes across conditions.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- D Okuonghae
- A Omame
