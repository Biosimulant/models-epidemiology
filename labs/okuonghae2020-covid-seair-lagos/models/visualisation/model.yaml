schema_version: '2.0'
title: Okuonghae2020 - SEAIR model of COVID-19 transmission in Lagos, Nigeria Visualisation
description: Desktop-compatible visualisation for the curated epidemiology lab.
standard: other
tags:
- epidemiology
- visualisation
- curated
biosim:
  entrypoint: src.epidemiology_visualisation:EpidemiologyVisualisationModel
  init_kwargs:
    lab_title: Okuonghae2020 - SEAIR model of COVID-19 transmission in Lagos, Nigeria
    question: How do asymptomatic and detected cases shape Lagos COVID-19 burden?
    sources:
    - alias: epidemiology_sbml_okuonghae2020_seair_model_of_covid_19_transmissi_biomd0000000991_model
      schemas:
        state:
          asymptomatic: float
          exposed: float
          deceased: float
          susceptible: float
          recovered: float
          symptomatic: float
          detected: float
          detected_cumulative: float
        summary:
          duration_simulated: float
          observable_count: int
          largest_change_observable: str
          largest_change_magnitude: float
          peak_observable: str
          peak_value: float
        species_labels:
          asymptomatic: str
          exposed: str
          deceased: str
          susceptible: str
          recovered: str
          symptomatic: str
          detected: str
          detected_cumulative: str
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
io:
  inputs:
  - name: epidemiology_sbml_okuonghae2020_seair_model_of_covid_19_transmissi_biomd0000000991_model_state
    maps_to: epidemiology_sbml_okuonghae2020_seair_model_of_covid_19_transmissi_biomd0000000991_model.state
    label: Model state
  - name: epidemiology_sbml_okuonghae2020_seair_model_of_covid_19_transmissi_biomd0000000991_model_summary
    maps_to: epidemiology_sbml_okuonghae2020_seair_model_of_covid_19_transmissi_biomd0000000991_model.summary
    label: Simulation summary
  - name: epidemiology_sbml_okuonghae2020_seair_model_of_covid_19_transmissi_biomd0000000991_model_species_labels
    maps_to: epidemiology_sbml_okuonghae2020_seair_model_of_covid_19_transmissi_biomd0000000991_model.species_labels
    label: Species labels
  outputs: []
