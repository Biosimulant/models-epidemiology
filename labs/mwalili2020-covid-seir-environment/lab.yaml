schema_version: '2.0'
title: Mwalili2020 - SEIR model of COVID-19 transmission and environmental pathogen
  prevalence Lab
description: 'Single-model lab wrapper for Mwalili2020 - SEIR model of COVID-19 transmission
  and environmental pathogen prevalence. Objective: Coronavirus disease 2019 (COVID-19)
  is a pandemic respiratory illness spreading from person-to-person caused by a novel
  coronavirus and poses a serious public health risk. It can be used to explore transmission
  dynamics and compare scenario outcomes across conditions.'
models:
- alias: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000964.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.state
  to:
  - visualisation.epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model_state
- from: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.summary
  to:
  - visualisation.epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model_summary
- from: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.species_labels
  to:
  - visualisation.epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model_species_labels
io:
  inputs:
  - name: incubation_rate
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.incubation_rate
    label: Incubation Rate
  outputs:
  - name: state
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.state
    label: Model state
  - name: summary
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.species_labels
    label: Species labels
  - name: infected_asymptomatic
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.infected_asymptomatic
    label: Infected Asymptomatic
  - name: exposed
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.exposed
    label: Exposed
  - name: infected_symptomatic
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.infected_symptomatic
    label: Infected Symptomatic
  - name: susceptible
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.susceptible
    label: Susceptible
  - name: recovered
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.recovered
    label: Recovered
  - name: pathogen
    maps_to: epidemiology_sbml_mwalili2020_seir_model_of_covid_19_transmission_biomd0000000964_model.pathogen
    label: Pathogen
runtime:
  duration: 10.0
  communication_step: 0.1
  initial_inputs: {}
