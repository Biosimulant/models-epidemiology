schema_version: '2.0'
title: Hou2020 - SEIR model of COVID-19 transmission in Wuhan
description: A novel coronavirus pneumonia, first identified in Wuhan City and referred
  to as COVID-19 by the World Health Organization, has been quickly spreading to other
  cities and countries. It can be used to explore transmission dynamics and compare
  scenario outcomes across conditions.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Can Hou
- Jiaxin Chen
- Yaqing Zhou
- Lei Hua
- Jinxia Yuan
upstream:
  id: biomodels_ebi:BIOMD0000000970
  source_db: biomodels_ebi
  source_id: BIOMD0000000970
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000970
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000970?filename=Hou2020.xml
  license: CC0
biosim:
  entrypoint: src.hou2020_seir_model_of_covid_19_transmission_in_w_biomd0000000970_model:Hou2020SeirModelOfCovid19TransmissionInWBiomd0000000970Model
  init_kwargs:
    model_path: data/BIOMD0000000970.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: recovery_rate
    maps_to: gamma
    label: Recovery Rate
    description: Recovery-rate parameter. Maps to SBML symbol `gamma`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: exposed
    maps_to: Exposed
    label: Exposed
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
  - name: total_population
    maps_to: Total_Population
    label: Total Population
