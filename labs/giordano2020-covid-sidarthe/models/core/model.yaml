schema_version: '2.0'
title: Giordano2020 - SIDARTHE model of COVID-19 spread in Italy
description: In Italy, 128,948 confirmed cases and 15,887 deaths of people who tested
  positive for SARS-CoV-2 were registered as of 5 April 2020. Ending the global SARS-CoV-2
  pandemic requires implementation of mu.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Giulia Giordano
- Franco Blanchini
- Raffaele Bruno
- Patrizio Colaneri
- Alessandro Di Filippo
upstream:
  id: biomodels_ebi:BIOMD0000000955
  source_db: biomodels_ebi
  source_id: BIOMD0000000955
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000955
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000955?filename=Giordano2020.xml
  license: CC0
biosim:
  entrypoint: src.giordano2020_sidarthe_model_of_covid_19_spread_i_biomd0000000955_model:Giordano2020SidartheModelOfCovid19SpreadIBiomd0000000955Model
  init_kwargs:
    model_path: data/BIOMD0000000955.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: undetected_transmission_rate
    maps_to: alpha
    label: Undetected Transmission Rate
    description: Transmission parameter from infected undetected cases. Maps to SBML
      symbol `alpha`.
  - name: diagnosed_transmission_rate
    maps_to: beta
    label: Diagnosed Transmission Rate
    description: Transmission parameter from diagnosed cases. Maps to SBML symbol
      `beta`.
  - name: ailing_transmission_rate
    maps_to: gamma
    label: Ailing Transmission Rate
    description: Transmission parameter from ailing cases. Maps to SBML symbol `gamma`.
  - name: recognition_rate
    maps_to: epsilon
    label: Recognition Rate
    description: Diagnosis/recognition transition parameter. Maps to SBML symbol `epsilon`.
  - name: severe_progression_rate
    maps_to: mu
    label: Severe Progression Rate
    description: Progression parameter toward threatened/severe state. Maps to SBML
      symbol `mu`.
  - name: healing_rate
    maps_to: lambda
    label: Healing Rate
    description: Healing/recovery transition parameter. Maps to SBML symbol `lambda`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: diagnosed
    maps_to: Diagnosed
    label: Diagnosed
  - name: ailing
    maps_to: Ailing
    label: Ailing
  - name: recognized
    maps_to: Recognized
    label: Recognized
  - name: threatened
    maps_to: Threatened
    label: Threatened
  - name: healed
    maps_to: Healed
    label: Healed
  - name: extinct
    maps_to: Extinct
    label: Extinct
