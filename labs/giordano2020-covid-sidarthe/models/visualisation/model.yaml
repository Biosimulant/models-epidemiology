schema_version: '2.0'
title: Giordano2020 - SIDARTHE model of COVID-19 spread in Italy Visualisation
description: Desktop-compatible visualisation for the curated epidemiology lab.
standard: other
tags:
- epidemiology
- visualisation
- curated
biosim:
  entrypoint: src.epidemiology_visualisation:EpidemiologyVisualisationModel
  init_kwargs:
    lab_title: Giordano2020 - SIDARTHE model of COVID-19 spread in Italy
    question: Which SIDARTHE disease-state pathway carries COVID-19 burden?
    sources:
    - alias: epidemiology_sbml_giordano2020_sidarthe_model_of_covid_19_spread_i_biomd0000000955_model
      schemas:
        state:
          Infected: float
          Susceptible: float
          Diagnosed: float
          Ailing: float
          Recognized: float
          Threatened: float
          Healed: float
          Extinct: float
        summary:
          duration_simulated: float
          observable_count: int
          largest_change_observable: str
          largest_change_magnitude: float
          peak_observable: str
          peak_value: float
        species_labels:
          Infected: str
          Susceptible: str
          Diagnosed: str
          Ailing: str
          Recognized: str
          Threatened: str
          Healed: str
          Extinct: str
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
io:
  inputs:
  - name: epidemiology_sbml_giordano2020_sidarthe_model_of_covid_19_spread_i_biomd0000000955_model_state
    maps_to: epidemiology_sbml_giordano2020_sidarthe_model_of_covid_19_spread_i_biomd0000000955_model.state
    label: Model state
  - name: epidemiology_sbml_giordano2020_sidarthe_model_of_covid_19_spread_i_biomd0000000955_model_summary
    maps_to: epidemiology_sbml_giordano2020_sidarthe_model_of_covid_19_spread_i_biomd0000000955_model.summary
    label: Simulation summary
  - name: epidemiology_sbml_giordano2020_sidarthe_model_of_covid_19_spread_i_biomd0000000955_model_species_labels
    maps_to: epidemiology_sbml_giordano2020_sidarthe_model_of_covid_19_spread_i_biomd0000000955_model.species_labels
    label: Species labels
  outputs: []
