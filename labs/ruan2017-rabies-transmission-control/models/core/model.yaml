schema_version: '2.0'
title: Ruan2017 - Transmission dynamics and control of rabies in China
description: Shigui Ruan. Modeling the transmission dynamics and control of rabies
  in China.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Shigui Ruan
upstream:
  id: biomodels_ebi:BIOMD0000000726
  source_db: biomodels_ebi
  source_id: BIOMD0000000726
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000726
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000726?filename=Model.xml
  license: CC0
biosim:
  entrypoint: src.ruan2017_transmission_dynamics_and_control_of_ra_biomd0000000726_model:Ruan2017TransmissionDynamicsAndControlOfRaBiomd0000000726Model
  init_kwargs:
    model_path: data/BIOMD0000000726.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: Transmission-rate parameter. Maps to SBML symbol `beta`.
  - name: recovery_rate
    maps_to: gamma
    label: Recovery Rate
    description: Recovery-rate parameter. Maps to SBML symbol `gamma`.
  - name: incubation_rate
    maps_to: sigma
    label: Incubation Rate
    description: Incubation/progression-rate parameter. Maps to SBML symbol `sigma`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: exposed_humans_e_h
    maps_to: E_h
    label: Exposed humans (E h)
  - name: infectious_humans_i_h
    maps_to: I_h
    label: Infectious humans (I h)
  - name: exposed_dogs_e_d
    maps_to: E_d
    label: Exposed dogs (E d)
  - name: infectious_dogs_i_d
    maps_to: I_d
    label: Infectious dogs (I d)
  - name: susceptible_dogs_s_d
    maps_to: S_d
    label: Susceptible dogs (S d)
  - name: recovered_dogs_r_d
    maps_to: R_d
    label: Recovered dogs (R d)
  - name: susceptible_humans_s_h
    maps_to: S_h
    label: Susceptible humans (S h)
  - name: recovered_humans_r_h
    maps_to: R_h
    label: Recovered humans (R h)
