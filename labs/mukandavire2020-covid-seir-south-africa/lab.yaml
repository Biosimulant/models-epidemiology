schema_version: '2.0'
title: Mukandavire2020 - SEIR model of early COVID-19 transmission in South Africa
  Lab
description: Single-model lab wrapper for Mukandavire2020 - SEIR model of early COVID-19
  transmission in South Africa. The emergence and fast global spread of COVID-19 has
  presented one of the greatest public health challenges in modern times with no proven
  cure or vaccine. Africa is still early in this epidemic, ther.
models:
- alias: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000978.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.state
  to:
  - visualisation.epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model_state
- from: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.summary
  to:
  - visualisation.epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model_summary
- from: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.species_labels
  to:
  - visualisation.epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model_species_labels
io:
  inputs:
  - name: transmission_rate
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.transmission_rate
    label: Transmission Rate
  - name: exposed_progression_rate
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.exposed_progression_rate
    label: Exposed Progression Rate
  - name: recovery_rate
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.recovery_rate
    label: Recovery Rate
  outputs:
  - name: state
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.state
    label: Model state
  - name: summary
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.species_labels
    label: Species labels
  - name: exposed
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.exposed
    label: Exposed
  - name: infected
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.infected
    label: Infected
  - name: susceptible
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.susceptible
    label: Susceptible
  - name: recovered
    maps_to: epidemiology_sbml_mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model.recovered
    label: Recovered
runtime:
  duration: 10.0
  communication_step: 0.1
  initial_inputs: {}
