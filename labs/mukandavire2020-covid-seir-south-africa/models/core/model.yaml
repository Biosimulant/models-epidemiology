schema_version: '2.0'
title: Mukandavire2020 - SEIR model of early COVID-19 transmission in South Africa
description: The emergence and fast global spread of COVID-19 has presented one of
  the greatest public health challenges in modern times with no proven cure or vaccine.
  Africa is still early in this epidemic, ther.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Zindoga Mukandavire
- Farai Nyabadza
- Noble J Malunguza
- Diego F Cuadros
- Tinevimbo Shiri
upstream:
  id: biomodels_ebi:BIOMD0000000978
  source_db: biomodels_ebi
  source_id: BIOMD0000000978
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000978
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000978?filename=Mukandavire2020.xml
  license: CC0
biosim:
  entrypoint: src.mukandavire2020_seir_model_of_early_covid_19_tra_biomd0000000978_model:Mukandavire2020SeirModelOfEarlyCovid19TraBiomd0000000978Model
  init_kwargs:
    model_path: data/BIOMD0000000978.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: COVID-19 transmission-rate parameter. Maps to SBML symbol `beta`.
  - name: exposed_progression_rate
    maps_to: sigma
    label: Exposed Progression Rate
    description: Exposed-to-infected progression parameter. Maps to SBML symbol `sigma`.
  - name: recovery_rate
    maps_to: gamma
    label: Recovery Rate
    description: Recovery-rate parameter. Maps to SBML symbol `gamma`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: exposed
    maps_to: Exposed
    label: Exposed
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
