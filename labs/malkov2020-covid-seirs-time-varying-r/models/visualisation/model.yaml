schema_version: '2.0'
title: Malkov2020 - SEIRS model of COVID-19 transmission with time-varying R values
  and reinfection Visualisation
description: Desktop-compatible visualisation for the curated epidemiology lab.
standard: other
tags:
- epidemiology
- visualisation
- curated
biosim:
  entrypoint: src.epidemiology_visualisation:EpidemiologyVisualisationModel
  init_kwargs:
    lab_title: Malkov2020 - SEIRS model of COVID-19 transmission with time-varying
      R values and reinfection
    question: Does time-varying reproduction behavior alter COVID-19 peak timing?
    sources:
    - alias: epidemiology_sbml_malkov2020_seirs_model_of_covid_19_transmission_biomd0000000980_model
      schemas:
        state:
          Exposed: float
          Infected: float
          Susceptible: float
          Recovered: float
          Total_population: float
        summary:
          duration_simulated: float
          observable_count: int
          largest_change_observable: str
          largest_change_magnitude: float
          peak_observable: str
          peak_value: float
        species_labels:
          Exposed: str
          Infected: str
          Susceptible: str
          Recovered: str
          Total_population: str
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
io:
  inputs:
  - name: epidemiology_sbml_malkov2020_seirs_model_of_covid_19_transmission_biomd0000000980_model_state
    maps_to: epidemiology_sbml_malkov2020_seirs_model_of_covid_19_transmission_biomd0000000980_model.state
    label: Model state
  - name: epidemiology_sbml_malkov2020_seirs_model_of_covid_19_transmission_biomd0000000980_model_summary
    maps_to: epidemiology_sbml_malkov2020_seirs_model_of_covid_19_transmission_biomd0000000980_model.summary
    label: Simulation summary
  - name: epidemiology_sbml_malkov2020_seirs_model_of_covid_19_transmission_biomd0000000980_model_species_labels
    maps_to: epidemiology_sbml_malkov2020_seirs_model_of_covid_19_transmission_biomd0000000980_model.species_labels
    label: Species labels
  outputs: []
