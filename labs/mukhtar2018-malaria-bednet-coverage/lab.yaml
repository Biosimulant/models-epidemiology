  to:
  - visualisation.epidemiology_sbml_mukhtar2018_modelling_the_effect_of_bednet_cover_model1812040003_model_state
- from: epidemiology_sbml_mukhtar2018_modelling_the_effect_of_bednet_cover_model1812040003_model.summary
  to:
  - visualisation.epidemiology_sbml_mukhtar2018_modelling_the_effect_of_bednet_cover_model1812040003_model_summary
- from: epidemiology_sbml_mukhtar2018_modelling_the_effect_of_bednet_cover_model1812040003_model.species_labels
  to:
  - visualisation.epidemiology_sbml_mukhtar2018_modelling_the_effect_of_bednet_cover_model1812040003_model_species_labels
