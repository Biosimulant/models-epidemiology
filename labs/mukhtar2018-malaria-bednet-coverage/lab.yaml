schema_version: '2.0'
package: mukhtar2018-malaria-bednet-coverage
version: 1.0.0
title: Mukhtar2018 - Modelling the effect of bednet coverage on malaria transmission
  in South Sudan Lab
description: Single-model lab wrapper for Mukhtar2018 - Modelling the effect of bednet
  coverage on malaria transmission in South Sudan.. Epidemiology Mukhtar2018Modelling
  The Effect Of Bednet Cover Model1812040003Model captures core biological behavior
  in the context of epidemiology, sbml, biomodels_ebi using a biomodels_ebi-sourced
  OTHER model. When you run it, you can observe state and evaluate how the modeled
  system changes across runs.
models:
- alias: epidemiology_sbml_mukhtar2018_modelling_the_effect_of_bednet_cover_model1812040003_model
  path: models/core
  parameters:
    model_path: data/MODEL1812040003.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
