schema_version: '2.0'
title: Zhao2020 - SUQC model of COVID-19 transmission dynamics in Wuhan, Hubei, and
  China Visualisation
description: Desktop-compatible visualisation for the curated epidemiology lab.
standard: other
tags:
- epidemiology
- visualisation
- curated
biosim:
  entrypoint: src.epidemiology_visualisation:EpidemiologyVisualisationModel
  init_kwargs:
    lab_title: Zhao2020 - SUQC model of COVID-19 transmission dynamics in Wuhan, Hubei,
      and China
    question: How does quarantine move infections into confirmed COVID-19 burden?
    sources:
    - alias: epidemiology_sbml_zhao2020_suqc_model_of_covid_19_transmission_dyn_biomd0000000962_model
      schemas:
        state:
          Unquarantined_Infected: float
          Quarantined_Infected: float
          Confirmed_Infected: float
          Cumulative_Infected: float
          Susceptible: float
        summary:
          duration_simulated: float
          observable_count: int
          largest_change_observable: str
          largest_change_magnitude: float
          peak_observable: str
          peak_value: float
        species_labels:
          Unquarantined_Infected: str
          Quarantined_Infected: str
          Confirmed_Infected: str
          Cumulative_Infected: str
          Susceptible: str
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
io:
  inputs:
  - name: epidemiology_sbml_zhao2020_suqc_model_of_covid_19_transmission_dyn_biomd0000000962_model_state
    maps_to: epidemiology_sbml_zhao2020_suqc_model_of_covid_19_transmission_dyn_biomd0000000962_model.state
    label: Model state
  - name: epidemiology_sbml_zhao2020_suqc_model_of_covid_19_transmission_dyn_biomd0000000962_model_summary
    maps_to: epidemiology_sbml_zhao2020_suqc_model_of_covid_19_transmission_dyn_biomd0000000962_model.summary
    label: Simulation summary
  - name: epidemiology_sbml_zhao2020_suqc_model_of_covid_19_transmission_dyn_biomd0000000962_model_species_labels
    maps_to: epidemiology_sbml_zhao2020_suqc_model_of_covid_19_transmission_dyn_biomd0000000962_model.species_labels
    label: Species labels
  outputs: []
