  license: CC0
biosim:
  entrypoint: src.bertozzi2020_sir_model_of_scenarios_of_covid_19_biomd0000000956_model:Bertozzi2020SirModelOfScenariosOfCovid19Biomd0000000956Model
  init_kwargs:
    model_path: data/BIOMD0000000956.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: reproduction_number
    maps_to: Ro
    label: Reproduction Number
    description: Basic reproduction number parameter. Maps to SBML symbol `Ro`.
  - name: recovery_rate
    maps_to: gamma
    label: Recovery Rate
    description: Recovery-rate parameter. Maps to SBML symbol `gamma`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
