tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Andrea L Bertozzi
- Elisa Franco
- George Mohler
- Martin B Short
- Daniel Sledge
upstream:
  id: biomodels_ebi:BIOMD0000000956
  source_db: biomodels_ebi
  source_id: BIOMD0000000956
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000956
