schema_version: '2.0'
title: Bertozzi2020 - SIR model of scenarios of COVID-19 spread in CA and NY
description: The coronavirus disease 2019 (COVID-19) pandemic has placed epidemic
  modeling at the forefront of worldwide public policy making. Nonetheless, modeling
  and forecasting the spread of COVID-19 remains a.
