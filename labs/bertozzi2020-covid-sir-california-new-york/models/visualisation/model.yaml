schema_version: '2.0'
title: Bertozzi2020 - SIR model of scenarios of COVID-19 spread in CA and NY Visualisation
description: Desktop-compatible visualisation for the curated epidemiology lab.
standard: other
tags:
- epidemiology
- visualisation
- curated
biosim:
  entrypoint: src.epidemiology_visualisation:EpidemiologyVisualisationModel
  init_kwargs:
    lab_title: Bertozzi2020 - SIR model of scenarios of COVID-19 spread in CA and
      NY
    question: Do the California/New York SIR scenarios produce a clear COVID-19 outbreak
      peak?
    sources:
    - alias: epidemiology_sbml_bertozzi2020_sir_model_of_scenarios_of_covid_19_biomd0000000956_model
      schemas:
        state:
          Infected: float
          Susceptible: float
          Recovered: float
        summary:
          duration_simulated: float
          observable_count: int
          largest_change_observable: str
          largest_change_magnitude: float
          peak_observable: str
          peak_value: float
        species_labels:
          Infected: str
          Susceptible: str
          Recovered: str
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
io:
  inputs:
  - name: epidemiology_sbml_bertozzi2020_sir_model_of_scenarios_of_covid_19_biomd0000000956_model_state
    maps_to: epidemiology_sbml_bertozzi2020_sir_model_of_scenarios_of_covid_19_biomd0000000956_model.state
    label: Model state
  - name: epidemiology_sbml_bertozzi2020_sir_model_of_scenarios_of_covid_19_biomd0000000956_model_summary
    maps_to: epidemiology_sbml_bertozzi2020_sir_model_of_scenarios_of_covid_19_biomd0000000956_model.summary
    label: Simulation summary
  - name: epidemiology_sbml_bertozzi2020_sir_model_of_scenarios_of_covid_19_biomd0000000956_model_species_labels
    maps_to: epidemiology_sbml_bertozzi2020_sir_model_of_scenarios_of_covid_19_biomd0000000956_model.species_labels
    label: Species labels
  outputs: []
