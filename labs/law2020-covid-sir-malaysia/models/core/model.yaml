schema_version: '2.0'
title: Law2020 - SIR model of COVID-19 transmission in Malyasia with time-varying
  parameters
description: The susceptible-infectious-removed (SIR) model offers the simplest framework
  to study transmission dynamics of COVID-19, however, it does not factor in its early
  depleting trend observed during a lock. It can be used to explore transmission dynamics
  and compare scenario outcomes across conditions.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Kian Boon Law
- Kalaiarasu M Peariasamy
- Balvinder Singh Gill
- Sarbhan Singh
- Bala Murali Sundram
upstream:
  id: biomodels_ebi:BIOMD0000000982
  source_db: biomodels_ebi
  source_id: BIOMD0000000982
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000982
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000982?filename=Law2020.xml
  license: CC0
biosim:
  entrypoint: src.law2020_sir_model_of_covid_19_transmission_in_ma_biomd0000000982_model:Law2020SirModelOfCovid19TransmissionInMaBiomd0000000982Model
  init_kwargs:
    model_path: data/BIOMD0000000982.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: Transmission-rate parameter. Maps to SBML symbol `beta`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: removed
    maps_to: Removed
    label: Removed
