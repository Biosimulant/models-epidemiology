schema_version: '2.0'
title: Law2020 - SIR model of COVID-19 transmission in Malyasia with time-varying
  parameters Visualisation
description: Desktop-compatible visualisation for the curated epidemiology lab.
standard: other
tags:
- epidemiology
- visualisation
- curated
biosim:
  entrypoint: src.epidemiology_visualisation:EpidemiologyVisualisationModel
  init_kwargs:
    lab_title: Law2020 - SIR model of COVID-19 transmission in Malyasia with time-varying
      parameters
    question: How does the Malaysia SIR model evolve under its time-varying transmission
      assumptions?
    sources:
    - alias: epidemiology_sbml_law2020_sir_model_of_covid_19_transmission_in_ma_biomd0000000982_model
      schemas:
        state:
          Infected: float
          Susceptible: float
          Removed: float
        summary:
          duration_simulated: float
          observable_count: int
          largest_change_observable: str
          largest_change_magnitude: float
          peak_observable: str
          peak_value: float
        species_labels:
          Infected: str
          Susceptible: str
          Removed: str
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
io:
  inputs:
  - name: epidemiology_sbml_law2020_sir_model_of_covid_19_transmission_in_ma_biomd0000000982_model_state
    maps_to: epidemiology_sbml_law2020_sir_model_of_covid_19_transmission_in_ma_biomd0000000982_model.state
    label: Model state
  - name: epidemiology_sbml_law2020_sir_model_of_covid_19_transmission_in_ma_biomd0000000982_model_summary
    maps_to: epidemiology_sbml_law2020_sir_model_of_covid_19_transmission_in_ma_biomd0000000982_model.summary
    label: Simulation summary
  - name: epidemiology_sbml_law2020_sir_model_of_covid_19_transmission_in_ma_biomd0000000982_model_species_labels
    maps_to: epidemiology_sbml_law2020_sir_model_of_covid_19_transmission_in_ma_biomd0000000982_model.species_labels
    label: Species labels
  outputs: []
