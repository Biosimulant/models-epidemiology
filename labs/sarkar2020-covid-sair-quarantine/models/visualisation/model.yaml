schema_version: '2.0'
title: Sarkar2020 - SAIR model of COVID-19 transmission with quarantine measures in
  India Visualisation
description: Desktop-compatible visualisation for the curated epidemiology lab.
standard: other
tags:
- epidemiology
- visualisation
- curated
biosim:
  entrypoint: src.epidemiology_visualisation:EpidemiologyVisualisationModel
  init_kwargs:
    lab_title: Sarkar2020 - SAIR model of COVID-19 transmission with quarantine measures
      in India
    question: Does quarantine reduce active infection in the SAIR COVID-19 model?
    sources:
    - alias: epidemiology_sbml_sarkar2020_sair_model_of_covid_19_transmission_w_biomd0000000977_model
      schemas:
        state:
          Susceptible: float
          Infected: float
          Asymptomatic: float
          Susceptible_quarantined: float
          Exposed_quarantined: float
          Recovered: float
        summary:
          duration_simulated: float
          observable_count: int
          largest_change_observable: str
          largest_change_magnitude: float
          peak_observable: str
          peak_value: float
        species_labels:
          Susceptible: str
          Infected: str
          Asymptomatic: str
          Susceptible_quarantined: str
          Exposed_quarantined: str
          Recovered: str
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
io:
  inputs:
  - name: epidemiology_sbml_sarkar2020_sair_model_of_covid_19_transmission_w_biomd0000000977_model_state
    maps_to: epidemiology_sbml_sarkar2020_sair_model_of_covid_19_transmission_w_biomd0000000977_model.state
    label: Model state
  - name: epidemiology_sbml_sarkar2020_sair_model_of_covid_19_transmission_w_biomd0000000977_model_summary
    maps_to: epidemiology_sbml_sarkar2020_sair_model_of_covid_19_transmission_w_biomd0000000977_model.summary
    label: Simulation summary
  - name: epidemiology_sbml_sarkar2020_sair_model_of_covid_19_transmission_w_biomd0000000977_model_species_labels
    maps_to: epidemiology_sbml_sarkar2020_sair_model_of_covid_19_transmission_w_biomd0000000977_model.species_labels
    label: Species labels
  outputs: []
