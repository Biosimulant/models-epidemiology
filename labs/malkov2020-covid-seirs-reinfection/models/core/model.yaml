schema_version: '2.0'
title: Malkov2020 - SEIRS model of COVID-19 transmission with reinfection
description: Epidemiological models of COVID-19 transmission assume that recovered
  individuals have a fully protected immunity. To date, there is no definite answer
  about whether people who recover from COVID-19 c.
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Egor Malkov
upstream:
  id: biomodels_ebi:BIOMD0000000979
  source_db: biomodels_ebi
  source_id: BIOMD0000000979
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000979
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000979?filename=Malkov2020.xml
  license: CC0
biosim:
  entrypoint: src.malkov2020_seirs_model_of_covid_19_transmission_biomd0000000979_model:Malkov2020SeirsModelOfCovid19TransmissionBiomd0000000979Model
  init_kwargs:
    model_path: data/BIOMD0000000979.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: Transmission-rate parameter. Maps to SBML symbol `beta`.
  - name: recovery_rate
    maps_to: gamma
    label: Recovery Rate
    description: Recovery-rate parameter. Maps to SBML symbol `gamma`.
  - name: incubation_rate
    maps_to: sigma
    label: Incubation Rate
    description: Incubation/progression-rate parameter. Maps to SBML symbol `sigma`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: exposed
    maps_to: Exposed
    label: Exposed
  - name: infected
    maps_to: Infected
    label: Infected
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
  - name: total_population
    maps_to: Total_population
    label: Total population
