schema_version: '2.0'
title: Tang2020 - Estimation of transmission risk of COVID-19 and impact of public
  health interventions Lab
description: Single-model lab wrapper for Tang2020 - Estimation of transmission risk
  of COVID-19 and impact of public health interventions. Since the emergence of the
  first cases in Wuhan, China, the novel coronavirus (2019-nCoV) infection has been
  quickly spreading out to other provinces and neighboring countries. It can be used
  to explore transmission dynamics and compare scenario outcomes across conditions.
models:
- alias: epidemiology_sbml_tang2020_estimation_of_transmission_risk_of_covi_biomd0000000971_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000971.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
