schema_version: '2.0'
title: Wan2020 - risk estimation and prediction of the transmission of COVID-19 in
  maninland China excluding Hubei province
description: 'Background: In December 2019, an outbreak of coronavirus disease (later
  named as COVID-19) was identified in Wuhan, China and, later on, detected in other
  parts of China. It can be used to explore transmission dynamics and compare scenario
  outcomes across conditions.'
standard: sbml
tags:
- biomodels_ebi
- curated
- epidemiology
- faithful
- sbml
- tellurium
authors:
- Biosimulant Team
- Hui Wan
- Jing-An Cui
- Guo-Jing Yang
upstream:
  id: biomodels_ebi:BIOMD0000000981
  source_db: biomodels_ebi
  source_id: BIOMD0000000981
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000981
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000981?filename=Wan2020.xml
  license: CC0
biosim:
  entrypoint: src.wan2020_risk_estimation_and_prediction_of_the_tr_biomd0000000981_model:Wan2020RiskEstimationAndPredictionOfTheTrBiomd0000000981Model
  init_kwargs:
    model_path: data/BIOMD0000000981.xml
    integration_step: 0.1
  communication_step: 0.1
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: transmission_rate
    maps_to: beta
    label: Transmission Rate
    description: Transmission-rate parameter. Maps to SBML symbol `beta`.
  outputs:
  - name: state
    maps_to: state
    label: Model state
  - name: summary
    maps_to: summary
    label: Simulation summary
  - name: species_labels
    maps_to: species_labels
    label: Species labels
  - name: recovered_from_hospitals
    maps_to: Recovered_from_hospitals
    label: Recovered from hospitals
  - name: susceptible_isolated
    maps_to: Susceptible_isolated
    label: Susceptible isolated
  - name: exposed
    maps_to: Exposed
    label: Exposed
  - name: infected
    maps_to: Infected
    label: Infected
  - name: hospitalised
    maps_to: Hospitalised
    label: Hospitalised
  - name: deceased
    maps_to: Deceased
    label: Deceased
  - name: susceptible
    maps_to: Susceptible
    label: Susceptible
  - name: recovered
    maps_to: Recovered
    label: Recovered
